<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить блюдо</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { margin-bottom: 8px; }
    </style>
</head>
<body>
<h2>Добавить блюдо</h2>
<form th:action="@{/menuItems}" th:object="${menuItem}" method="post">
    Название: <input type="text" th:field="*{name}" required>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span><br>

    Описание: <input type="text" th:field="*{description}" required>
    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red"></span><br>

    Цена: <input type="number" step="0.01" th:field="*{price}" required>
    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red"></span><br>

    Доступно: <input type="checkbox" th:field="*{available}"><br>

    Ссылка на изображение: <input type="text" th:field="*{imageUrl}" required>
    <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" style="color:red"></span><br>

    ID категории: <input type="number" th:field="*{categoryId}" required>
    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:red"></span><br>

    <button type="submit">Сохранить</button>
    <a href="/menuItems">Назад</a>
</form>
</body>
</html>
