<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление товара</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 700px; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #c62828; font-size: 13px; margin-top: 4px; }
        button { padding: 8px 16px; background-color: #ff9800; color: white; border: none; cursor: pointer; border-radius: 3px; }
        a { margin-left: 10px; color: #ff9800; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>Добавить товар в магазин кошек</h2>
    <form th:action="@{/menuItems}" th:object="${menuItem}" method="post">
        <div class="field">
            <label>Название</label>
            <input type="text" th:field="*{name}" required>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label>Описание</label>
            <input type="text" th:field="*{description}" required>
            <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="field">
            <label>Цена</label>
            <input type="number" step="0.01" min="0.01" th:field="*{price}" required>
            <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="field">
            <label>
                <input type="checkbox" th:field="*{available}"> Доступно
            </label>
        </div>

        <div class="field">
            <label>URL изображения</label>
            <input type="text" th:field="*{imageUrl}" required>
            <div class="error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
        </div>

        <div class="field">
            <label>ID категории</label>
            <input type="number" min="1" th:field="*{categoryId}" required>
            <div class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <button type="submit">Сохранить</button>
        <a href="/menuItems">Назад</a>
    </form>
</div>
</body>
</html>
